<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Morgenhelt" />
    <title>Morgenhelt</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="preload" href="icons/streak.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="icons/star.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="icons/level-badge.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="icons/settings.svg" as="image" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar panel">
        <div class="brand-lockup">
          <img src="logo.svg" alt="Morgenhelt" class="site-logo" width="2400" height="867" />
          <section class="morning-hero" aria-label="Dagens oversikt">
            <p class="eyebrow">Hero Journey</p>
            <h1 id="heroTitle">God morgen</h1>
            <p id="heroSubtitle">Velg en helt og start dagens eventyr.</p>
            <div class="hero-progress-track" aria-hidden="true"><div id="heroProgress"></div></div>
          </section>
        </div>
        <div class="topbar-actions">
          <button id="openSettings" class="settings-btn" type="button" aria-label="Åpne innstillinger">
            <span class="settings-fallback" aria-hidden="true">⚙</span>
            <img src="icons/settings.svg" alt="" aria-hidden="true" class="settings-icon" />
          </button>
        </div>
      </header>

      <main>

        <section class="panel boards-panel">
          <div class="child-admin-panel" aria-label="Barn">
            <div class="child-create-row">
              <label for="newChildName" class="sr-only">Nytt barn</label>
              <input id="newChildName" type="text" autocomplete="off" placeholder="Legg til person" />
              <button id="addChildBtn" class="add-child-inline" type="button" aria-label="Legg til person">+</button>
            </div>
          </div>
          <p id="emptyState" class="note" hidden>Legg til et barn for å komme i gang.</p>
          <div id="childBoards" class="child-boards"></div>
        </section>

        <section class="panel points-panel">
          <h2>Poeng og premier</h2>
          <div id="pointsOverview" class="points-overview"></div>
        </section>

        <section class="panel stats-panel">
          <h2>Ukesammendrag</h2>
          <div id="weeklyStats"></div>
        </section>
      </main>
    </div>

    <dialog id="parentDialog" class="settings-dialog">
      <section id="parentSettings" class="parent-settings-panel">
        <button id="closeSettingsX" class="settings-close-x" type="button" aria-label="Lukk innstillinger">✕</button>
        <h3>Innstillinger</h3>
        <label class="switch-row"><input id="soundToggle" type="checkbox" /> Lyd på ved fullførte oppgaver</label>
        <label class="switch-row"><input id="bonusTasksToggle" type="checkbox" /> Bonusoppgaver på</label>

        <div class="score-stepper">
          <button id="baseMinus" class="step-btn" type="button" aria-label="Senk poeng per oppgave">−</button>
          <label>Poeng per oppgave <input id="basePoints" type="number" min="1" max="50" hidden /><span id="basePointsDisplay" class="score-value-display"></span></label>
          <button id="basePlus" class="step-btn" type="button" aria-label="Øk poeng per oppgave">+</button>
        </div>

        <div class="score-stepper">
          <button id="bonusMinus" class="step-btn" type="button" aria-label="Senk maks tidsbonus">−</button>
          <label>Maks tidsbonus per oppgave <input id="bonusPoints" type="number" min="0" max="20" hidden /><span id="bonusPointsDisplay" class="score-value-display"></span></label>
          <button id="bonusPlus" class="step-btn" type="button" aria-label="Øk maks tidsbonus">+</button>
        </div>

        <section class="reward-settings">
          <h3>Premier</h3>
          <div id="rewardSettingsList" class="reward-settings-list"></div>
          <div class="reward-create-row">
            <input id="rewardTitleInput" type="text" placeholder="Premietittel" />
            <input id="rewardCostInput" type="number" min="1" max="100000" placeholder="Poeng" />
            <button id="addRewardBtn" class="success" type="button">Legg til premie</button>
          </div>
        </section>

        <button id="settingsLogout" class="settings-logout" type="button">Logg ut</button>
      </section>
    </dialog>

    <div class="level-badge-template" aria-hidden="true"></div>
    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5aa5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Morgenhelt" />
    <title>Morgenhelt</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="authScreen" class="auth-screen app">
      <img src="logo.svg" alt="Morgenhelt" class="site-logo" width="800" height="289" />
      <div class="auth-card">
        <h2>Logg inn for å starte</h2>
        <p id="authStatus" class="note">Logg inn for å starte.</p>
        <div class="auth-grid">
          <button id="authGoogle" class="primary" type="button">Logg inn med Google</button>
          <button id="authFacebook" class="primary" type="button">Logg inn med Facebook</button>
          <button id="authApple" class="primary" type="button">Logg inn med Apple</button>
        </div>
      </div>
      <button id="skipLoginBtn" class="secondary skip-login-btn" type="button">Midlertidig: Gå til hovedsiden uten innlogging</button>
    </section>

    <div id="appShell" class="app" hidden>
      <header class="topbar panel">
        <div>
          <img src="logo.svg" alt="Morgenhelt" class="site-logo" width="800" height="289" />
        </div>
        <div class="topbar-actions">
          <button id="openParentMode" class="secondary">Foreldremodus</button>
          <button id="logoutBtn" class="secondary">Logg ut</button>
        </div>
      </header>

      <main>
        <section class="panel child-admin-panel">
          <h2>Barn</h2>
          <div class="child-create-row">
            <input id="newChildName" type="text" placeholder="Nytt barnenavn" />
            <button id="addChildBtn" class="success" type="button">Legg til barn</button>
          </div>
          <p id="emptyState" class="note">Ingen barn lagt til ennå. Legg til første barn for å starte.</p>
        </section>

        <section class="panel boards-panel">
          <div id="childBoards" class="child-boards"></div>
        </section>

        <section class="panel stats-panel">
          <h2>Ukesammendrag</h2>
          <div id="weeklyStats"></div>
        </section>
      </main>
    </div>

    <dialog id="parentDialog">
      <form method="dialog" id="pinForm" class="pin-form">
        <h3>Foreldremodus</h3>
        <label>PIN <input id="pinInput" type="password" inputmode="numeric" minlength="4" maxlength="8" required /></label>
        <div class="row">
          <button value="cancel" class="secondary" type="button" id="cancelPin">Avbryt</button>
          <button value="default" class="primary" type="submit">Åpne</button>
        </div>
        <p class="note">Standard PIN er 1234.</p>
      </form>

      <section id="parentSettings" hidden>
        <h3>Innstillinger</h3>
        <label>Ny PIN <input id="newPin" type="password" inputmode="numeric" minlength="4" maxlength="8" /></label>
        <label class="switch-row"><input id="soundToggle" type="checkbox" /> Lyd på ved fullførte oppgaver</label>
        <label>Poeng per oppgave <input id="basePoints" type="number" min="1" max="50" /></label>
        <label>Maks tidsbonus per oppgave <input id="bonusPoints" type="number" min="0" max="20" /></label>
        <div class="row">
          <button id="saveSettings" class="success" type="button">Lagre</button>
          <button id="closeParent" class="secondary" type="button">Lukk</button>
        </div>
      </section>
    </dialog>

    <script src="firebase-config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
  </body>
</html>
